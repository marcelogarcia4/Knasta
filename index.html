<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscador de Productos</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Buscador de Productos (Shopee / Amazon / etc)</h1>

    <div class="input-group mb-3">
      <input type="text" id="busqueda" class="form-control" placeholder="Escribe 'notebook', 'mouse', etc.">
      <div class="input-group-append">
        <button class="btn btn-primary" id="buscarBtn">Buscar</button>
      </div>
    </div>

    <div id="resultados" class="row mt-4"></div>
    <div id="mensajeError" class="alert alert-danger mt-3" style="display: none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
